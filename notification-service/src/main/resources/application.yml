server:
  port: 3317
spring:
  profiles:
    active: prod
  application:
    name: notification-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  sql:
    init:
      mode: never

  datasource:
    url: jdbc:mysql://localhost:3306/notification_service?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        show_sql: true
        format_sql: true
        highlight_sql: true
        connection:
          autocommit: false
  flyway:
    enabled: false
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
  mail:
    host: smtp.gmail.com
    port: 587
    username: pujarikarthikvarma@gmail.com
    password: tqqwazcljsesfkng
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.ssl.enable: false
app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-to-a-long-random-string}
    issuer: ${JWT_ISSUER:org-access}
org-access:
  service:
    url: ${ORG_ACCESS_SERVICE_URL:http://localhost:3310}
    token: ${ORG_ACCESS_TOKEN:}
notification:
  sending:
    enabled: ${NOTIFICATION_SENDING_ENABLED:true}
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
sync:
  service: notification-service
  keys:
    order-service: ${ORDER_SYNC_KEY:}
    payment-service: ${PAYMENT_SYNC_KEY:}
    fulfillment-service: ${FULFILLMENT_SYNC_KEY:}
  targets:
    order-service: ${ORDER_SERVICE_URL:http://localhost:3311}
    payment-service: ${PAYMENT_SERVICE_URL:http://localhost:3314}
    fulfillment-service: ${FULFILLMENT_SERVICE_URL:http://localhost:3315}
    notification-service: ${NOTIFICATION_SERVICE_URL:http://localhost:3317}
  routes:
    unused: notification-service
