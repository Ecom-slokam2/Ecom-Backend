name: ecom-backend

x-app: &app
  restart: unless-stopped
  init: true
  volumes:
    - sync-tls:/tls:ro
  healthcheck:
    test: [CMD-SHELL, 'curl -fsS "http://localhost:$$SERVER_PORT/actuator/health" >/dev/null']
    interval: 15s
    timeout: 5s
    retries: 20
    start_period: 90s

x-environment: &environment
  JAVA_TOOL_OPTIONS: '-Xms${DOCKER_JAVA_XMS:-32m} -Xmx${DOCKER_JAVA_XMX:-192m} -Djavax.net.ssl.trustStore=/tls/truststore.p12 -Djavax.net.ssl.trustStorePassword=changeit'
  JWT_SECRET: ${DOCKER_JWT_SECRET:-docker-local-jwt-secret-change-before-sharing-1234567890}
  ORDER_SYNC_KEY: ${DOCKER_ORDER_SYNC_KEY:-docker-local-order-sync-key-1234567890123456}
  PAYMENT_SYNC_KEY: ${DOCKER_PAYMENT_SYNC_KEY:-docker-local-payment-sync-key-12345678901234}
  FULFILLMENT_SYNC_KEY: ${DOCKER_FULFILLMENT_SYNC_KEY:-docker-local-fulfillment-sync-key-1234567890}
  INVENTORY_SYNC_KEY: ${DOCKER_INVENTORY_SYNC_KEY:-docker-local-inventory-sync-key-123456789012}
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  MYSQL_USERNAME: ecom
  MYSQL_PASSWORD: ${DOCKER_MYSQL_PASSWORD:-ecom-local-password}
  CONFIG_SERVER_URL: http://config-server:8888
  EUREKA_SERVER_URL: http://eureka:8761/eureka
  ORG_ACCESS_URL: http://org-access:3310
  ORG_ACCESS_SERVICE_URL: http://org-access:3310
  ORDER_SERVICE_URL: http://order-service:3311
  ORDERS_SERVICE_URL: http://order-service:3311
  PAYMENT_SERVICE_URL: http://payment-service:3314
  FULFILLMENT_SERVICE_URL: http://fulfillment-service:3315
  NOTIFICATION_SERVICE_URL: http://notification-service:3317
  NOTIFICATIONS_SERVICE_URL: http://notification-service:3317
  INVENTORY_SERVICE_URL: http://inventory-service:8095
  CART_SERVICE_URL: http://cart-service:8091
  CATALOG_SERVICE_URL: http://catalog-service:8089
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  SMTP_FROM: ecom@localhost.test
  MAIL_FROM: ecom@localhost.test
  SPRING_APPLICATION_JSON: >-
    {"spring.profiles.active":"prod","spring.config.import":"optional:configserver:http://config-server:8888","eureka.client.service-url.defaultZone":"http://eureka:8761/eureka","eureka.instance.prefer-ip-address":true,"spring.datasource.hikari.maximum-pool-size":${DOCKER_DB_POOL_MAX:-5},"spring.datasource.hikari.minimum-idle":${DOCKER_DB_POOL_MIN_IDLE:-1},"spring.flyway.enabled":false,"spring.jpa.hibernate.ddl-auto":"validate","spring.sql.init.mode":"never","spring.mail.host":"mailpit","spring.mail.port":1025,"spring.mail.username":"","spring.mail.password":"","spring.mail.properties.mail.smtp.auth":false,"spring.mail.properties.mail.smtp.starttls.enable":false,"spring.mail.properties.mail.smtp.starttls.required":false,"management.health.mail.enabled":false,"sync.targets":{"order-service":"https://sync-proxy:3311","payment-service":"https://sync-proxy:3314","fulfillment-service":"https://sync-proxy:3315","notification-service":"https://sync-proxy:3317","inventory-service":"https://sync-proxy:8095"}}

services:
  mysql:
    image: mysql:8.0.46
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DOCKER_MYSQL_ROOT_PASSWORD:-ecom-local-root-password}
      DOCKER_MYSQL_PASSWORD: ${DOCKER_MYSQL_PASSWORD:-ecom-local-password}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql -h 127.0.0.1 -uroot -Nse "SELECT ready FROM docker_bootstrap.status WHERE ready=1" | grep -qx 1']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  tls-init:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    entrypoint: [sh, /setup/init.sh]
    volumes:
      - sync-tls:/tls
      - ./docker/tls/init.sh:/setup/init.sh:ro

  sync-proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    volumes:
      - sync-tls:/tls:ro
      - ./docker/tls/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      tls-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DOCKER_MAIL_UI_PORT:-18093}:8025"

  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 45s

  eureka:
    <<: *app
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SERVICE: Ecom-eureka-server
    environment:
      <<: *environment
      SERVER_PORT: "8761"
      SPRING_APPLICATION_JSON: >-
        {"spring.profiles.active":"prod","spring.config.import":"","eureka.client.service-url.defaultZone":"http://eureka:8761/eureka","eureka.instance.prefer-ip-address":true,"spring.datasource.hikari.maximum-pool-size":${DOCKER_DB_POOL_MAX:-5},"spring.datasource.hikari.minimum-idle":${DOCKER_DB_POOL_MIN_IDLE:-1},"spring.flyway.enabled":false,"spring.jpa.hibernate.ddl-auto":"validate","spring.sql.init.mode":"never","spring.mail.host":"mailpit","spring.mail.port":1025,"spring.mail.username":"","spring.mail.password":"","spring.mail.properties.mail.smtp.auth":false,"spring.mail.properties.mail.smtp.starttls.enable":false,"spring.mail.properties.mail.smtp.starttls.required":false,"management.health.mail.enabled":false,"sync.targets":{"order-service":"https://sync-proxy:3311","payment-service":"https://sync-proxy:3314","fulfillment-service":"https://sync-proxy:3315","notification-service":"https://sync-proxy:3317","inventory-service":"https://sync-proxy:8095"}}
    ports:
      - "127.0.0.1:${DOCKER_EUREKA_PORT:-18081}:8761"
    depends_on:
      tls-init:
        condition: service_completed_successfully

  config-server:
    <<: *app
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SERVICE: Ecom-config-server
    environment:
      <<: *environment
      SERVER_PORT: "8888"
      SPRING_APPLICATION_JSON: >-
        {"spring.profiles.active":"prod","spring.config.import":"","eureka.client.service-url.defaultZone":"http://eureka:8761/eureka","eureka.instance.prefer-ip-address":true,"spring.datasource.hikari.maximum-pool-size":${DOCKER_DB_POOL_MAX:-5},"spring.datasource.hikari.minimum-idle":${DOCKER_DB_POOL_MIN_IDLE:-1},"spring.flyway.enabled":false,"spring.jpa.hibernate.ddl-auto":"validate","spring.sql.init.mode":"never","spring.mail.host":"mailpit","spring.mail.port":1025,"spring.mail.username":"","spring.mail.password":"","spring.mail.properties.mail.smtp.auth":false,"spring.mail.properties.mail.smtp.starttls.enable":false,"spring.mail.properties.mail.smtp.starttls.required":false,"management.health.mail.enabled":false,"sync.targets":{"order-service":"https://sync-proxy:3311","payment-service":"https://sync-proxy:3314","fulfillment-service":"https://sync-proxy:3315","notification-service":"https://sync-proxy:3317","inventory-service":"https://sync-proxy:8095"}}
    ports:
      - "127.0.0.1:${DOCKER_CONFIG_SERVER_PORT:-18082}:8888"
    depends_on:
      tls-init:
        condition: service_completed_successfully
      eureka:
        condition: service_healthy

  org-access:
    <<: *app
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SERVICE: Ecom-Org-access
    environment:
      <<: *environment
      SERVER_PORT: "3310"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/users_roles?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ecom
      SPRING_DATASOURCE_PASSWORD: ${DOCKER_MYSQL_PASSWORD:-ecom-local-password}
    ports:
      - "127.0.0.1:${DOCKER_ORG_ACCESS_PORT:-18083}:3310"
    depends_on:
      tls-init:
        condition: service_completed_successfully
      eureka:
        condition: service_healthy
      config-server:
        condition: service_healthy
      sync-proxy:
        condition: service_healthy
      mailpit:
        condition: service_started
      mysql:
        condition: service_healthy

  customer-profile-service:
