events {}
http {
  resolver 127.0.0.11 valid=10s;
  server { listen 8080; location = /health { return 200 "ok"; } }
  server {
    listen 3311 ssl;
    ssl_certificate /tls/server.crt;
    ssl_certificate_key /tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    location = /internal/events {
      set $backend http://order-service:3311;
      proxy_pass $backend;
      proxy_set_header Host $host;
      proxy_connect_timeout 2s;
      proxy_read_timeout 5s;
    }
    location / { return 404; }
  }
  server {
    listen 3314 ssl;
    ssl_certificate /tls/server.crt;
    ssl_certificate_key /tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    location = /internal/events {
      set $backend http://payment-service:3314;
      proxy_pass $backend;
      proxy_set_header Host $host;
      proxy_connect_timeout 2s;
      proxy_read_timeout 5s;
    }
    location / { return 404; }
  }
  server {
    listen 3315 ssl;
    ssl_certificate /tls/server.crt;
    ssl_certificate_key /tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    location = /internal/events {
      set $backend http://fulfillment-service:3315;
      proxy_pass $backend;
      proxy_set_header Host $host;
      proxy_connect_timeout 2s;
      proxy_read_timeout 5s;
    }
    location / { return 404; }
  }
  server {
    listen 3317 ssl;
    ssl_certificate /tls/server.crt;
    ssl_certificate_key /tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    location = /internal/events {
      set $backend http://notification-service:3317;
      proxy_pass $backend;
      proxy_set_header Host $host;
      proxy_connect_timeout 2s;
      proxy_read_timeout 5s;
    }
    location / { return 404; }
  }
  server {
    listen 8095 ssl;
    ssl_certificate /tls/server.crt;
    ssl_certificate_key /tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    location = /internal/events {
      set $backend http://inventory-service:8095;
      proxy_pass $backend;
      proxy_set_header Host $host;
      proxy_connect_timeout 2s;
      proxy_read_timeout 5s;
    }
    location / { return 404; }
  }
}
