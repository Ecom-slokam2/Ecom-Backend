server:
  port: 8095
app:
  jwt:
    secret: "${JWT_SECRET:change-this-secret-to-a-long-random-string}"
    issuer: org-access
catalog:
  service:
    url: ${CATALOG_SERVICE_URL:http://localhost:8089}
spring:
  application:
    name: inventory-service
  config:
    import: "optional:configserver:http://localhost:8888"
  sql:
    init:
      mode: never

  datasource:
    url: "jdbc:mysql://localhost:3306/inventory-service?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
    username: "root"
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: false
    baseline-on-migrate: true
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

sync:
  service: inventory-service
  keys:
    inventory-service: ${INVENTORY_SYNC_KEY:}
    order-service: ${ORDER_SYNC_KEY:}
  targets:
    order-service: ${ORDER_SERVICE_URL:http://localhost:3311}
  routes:
    checkout-reservation-result: order-service
